<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout editor · cluster_themes</title>
<style>
  :root { --bg:#0b0d10; --panel:#14171c; --line:#232830; --ink:#dfe3ea; --dim:#8b93a1; --accent:#4c9aff; --warn:#ffb020; --bad:#ff5d5d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:12px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  #app { display:grid; grid-template-columns:238px 1fr 300px; grid-template-rows:44px 1fr; height:100%; }
  header { grid-column:1/4; display:flex; align-items:center; gap:10px; padding:0 12px;
    border-bottom:1px solid var(--line); background:#0e1116; }
  header b { font-size:13px; font-weight:600; }
  header .grow { flex:1; }
  button, select, input, textarea { font:inherit; color:var(--ink); background:#1a1e25;
    border:1px solid var(--line); border-radius:5px; padding:3px 7px; }
  button { cursor:pointer; } button:hover { border-color:#3a4250; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  #status { color:var(--dim); min-width:220px; }
  #status.err { color:var(--bad); } #status.ok { color:#57d38c; }
  aside, #left { overflow:auto; border-right:1px solid var(--line); background:var(--panel); }
  #right { border-right:0; border-left:1px solid var(--line); }
  .hd { position:sticky; top:0; z-index:2; background:var(--panel); padding:8px 10px;
    border-bottom:1px solid var(--line); font-weight:600; letter-spacing:.02em; }
  #list { padding:4px 0; }
  /* One header per type, with a mini glyph per row so a widget is recognisable without reading its id. */
  .grp { display:flex; align-items:center; gap:6px; padding:5px 10px 3px; cursor:pointer;
    color:var(--dim); font-size:11px; letter-spacing:.05em; text-transform:uppercase; user-select:none;
    border-top:1px solid #1c2129; margin-top:2px; }
  .grp:first-child { border-top:0; margin-top:0; }
  .grp:hover { color:var(--ink); }
  .grp .n { color:#5f6a7a; }
  .grp .car { margin-left:auto; color:#5f6a7a; font-size:10px; }
  .gl { width:20px; height:14px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:600; border-radius:3px; color:#bcd0ea; background:#1b2330;
    border:1px solid #263041; }
  .gl.t { color:#d9e2ee; }           /* text */
  .gl.d { color:#7fd1ff; }           /* dial / arc */
  .gl.s { color:#a9d18e; }           /* sprite / picture */
  .gl.f { color:#ffd479; }           /* fill / bars */
  .gl.m { color:#ff9b9b; }           /* badge */
  .row .gl { margin-right:1px; }
  .row { display:flex; gap:6px; align-items:center; padding:2px 10px; cursor:pointer; }
  .row:hover { background:#1b2028; }
  .row.on { background:#1d2c42; }
  .row .id { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .ty { color:var(--dim); font-size:11px; }
  .row.hidden { opacity:.45; }
  #stagewrap { position:relative; overflow:hidden; background:#07090c; }
  #live { position:absolute; left:0; top:0; width:1920px; height:720px; border:0; transform-origin:0 0;
    pointer-events:none; opacity:.62; transition:opacity .15s; }
  #stagewrap.live #live { opacity:1; }
  #stagewrap.live .wg { border-color:rgba(90,140,200,.14); background:transparent; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; }
  #stagewrap.live #stage { background:transparent; }
  .wg { position:absolute; border:1px solid rgba(120,170,235,.42); background:rgba(30,60,110,.05);
    overflow:hidden; cursor:move; }
  #stagewrap.live .wg { border-color:rgba(90,140,200,.14); background:transparent; }
  .wg .tag { position:absolute; left:0; top:0; padding:0 3px; font-size:9px; color:#9dc2ff;
    background:rgba(8,14,22,.7); pointer-events:none; display:none; }
  .wg.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; background:rgba(76,154,255,.10); }
  .wg.sel .tag, .wg:hover .tag { display:block; }
  .guide { position:absolute; background:#ff4d6d; pointer-events:none; z-index:9; }
  .guide.v { width:1px; height:720px; top:0; }
  .guide.h { height:1px; width:1920px; left:0; }
  .wg.oob { border-color:var(--bad); }
  .wg .h { position:absolute; right:-5px; bottom:-5px; width:10px; height:10px; background:var(--accent);
    border-radius:2px; cursor:nwse-resize; display:none; }
  .wg.sel .h { display:block; }
  #right .sec { padding:10px; border-bottom:1px solid var(--line); }
  #right .sec h4 { margin:0 0 8px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .f { display:grid; grid-template-columns:74px 1fr; gap:6px; align-items:center; margin-bottom:6px; }
  .f label { color:var(--dim); }
  .f input, .f select, .f textarea { width:100%; }
  .f textarea { min-height:52px; font-family:ui-monospace, Consolas, monospace; font-size:11px; }
  #hint { color:var(--dim); padding:8px 10px; }
  .kbd { border:1px solid var(--line); border-radius:3px; padding:0 3px; color:var(--dim); }

#howto{color:#9fb4cc;text-decoration:none;font-size:12px;padding:5px 9px;border:1px solid #263041;border-radius:6px}
#howto:hover{color:#e6ecf4;border-color:#3b4a61}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Layout editor</b>
    <select id="which"></select>
    <button id="revert" title="reload from disk">Revert</button>
    <button id="dup" title="copy this theme under a new name">Duplicate</button>
    <button id="del" title="delete this bench copy (shipped themes cannot be deleted)">Delete</button>
    <span class="grow"></span>
    <label><input type="checkbox" id="livebox"> live</label>
    <label title="hide widget outlines"><input type="checkbox" id="boxhide"> clean</label>
    <label>zoom <button id="zoomout" title="zoom out (Ctrl -)">−</button>
      <select id="zoom">
        <option value="fit">fit</option><option value="0.25">25%</option><option value="0.33">33%</option>
        <option value="0.5">50%</option><option value="0.67">67%</option><option value="0.75">75%</option>
        <option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option>
        <option value="2">200%</option><option value="custom">—</option>
      </select>
      <button id="zoomin" title="zoom in (Ctrl +)">+</button></label>
    <button id="undo" disabled>Undo</button>
    <a id="howto" href="/howto" target="_blank" title="how to cut a widget out of a reference picture">? how&nbsp;to</a>
        <button id="save" class="primary">Save</button>
    <span id="status">loading…</span>
  </header>

  <div id="left">
    <div class="hd">Widgets <span id="count" style="color:var(--dim);font-weight:400"></span></div>
    <div class="sec" style="border-top:1px solid var(--line)">
      <h4>Add a widget</h4>
      <div class="f"><select id="newtype"></select></div>
      <button id="add" style="width:100%">Add widget</button>
      <button id="upload" style="width:100%;margin-top:6px" title="bake a picture into a sprite and place it">Upload picture…</button>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" style="display:none">
      <div class="f" style="margin-top:6px"><label>key</label>
        <select id="upkey"><option value="black">black bg</option><option value="luma">luma mask</option><option value="none">none</option></select>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <div id="stagewrap">
    <iframe id="live" src="about:blank"></iframe>
    <div id="stage"></div>
  </div>

  <aside id="right">
    <div class="hd">Properties</div>
    <div id="props"><div id="hint">Select a widget on the stage or in the list.</div></div>
    <div class="sec">
      <h4>Keys</h4>
      <div id="hint2" style="color:var(--dim)">drag to move · corner to resize · arrows nudge · <span class="kbd">del</span> removes</div>
    </div>
  </aside>
</div>

<script>
'use strict';
const S = { schema:null, name:null, doc:null, sel:null, undo:[], zoom:1, zoomMode:'fit', dirty:false, fold:{} };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch (e) { /* plain text */ }
  if (!r.ok) throw new Error((j && j.error) || t || ('HTTP ' + r.status));
  return j;
}
function say(msg, kind) { const s = $('status'); s.textContent = msg || ''; s.className = kind || ''; }

/* ---------- load ---------- */
async function boot() {
  S.schema = await api('/schema');
  const w = $('which');
  S.schema.layouts.forEach((n) => { const o = el('option', null, n); o.value = n; w.appendChild(o); });
  S.name = S.schema.current && S.schema.layouts.indexOf(S.schema.current) >= 0 ? S.schema.current : S.schema.layouts[0];
  w.value = S.name;
  const nt = $('newtype');
  Object.keys(S.schema.types).sort().forEach((t) => { const o = el('option', null, t); o.value = t; nt.appendChild(o); });
  await load(S.name);
}
async function load(name) {
  say('loading ' + name + '…');
  const j = await api('/layout?name=' + encodeURIComponent(name));
  S.name = name; S.doc = j.data; S.sel = null; S.undo = []; S.dirty = false;
  $('which').value = name;
  say((j.overridden ? 'override' : 'shipped') + ' · ' + S.doc.widgets.length + ' widgets');
  render();
  // The plate is the app, and the app shows whatever "hudLayout" says — so switching here has to switch
  // there too, otherwise the picture keeps the layout it was last told to draw.
  showInApp(name);
}
async function showInApp(name) {
  try {
    // "byMode" (SPORT/COMFORT/ECO PRO each pick their own theme) overrides "hudLayout" — clear it, or the
    // app would keep drawing whichever theme the drive mode selects.
    const post = (key, value) => api('/setting', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ key:key, value:value }) });
    await post('byMode', false);
    await post('hudLayout', name);
    setTimeout(mountPlate, 400);
  } catch (e) {
    // the app is not running; the boxes still edit fine
  }
}

/* ---------- render ---------- */
function order() {
  // the app draws by z, then by array order
  return S.doc.widgets.map((w, i) => ({ w: w, i: i }))
    .sort((a, b) => ((a.w.z || 0) - (b.w.z || 0)) || (a.i - b.i)).map((x) => x.w);
}
// A 20x14 chip per type: the letter says what kind of thing it is at a glance (text, dial, picture, bar,
// badge), so a list of 90 ids stays scannable. Purely a legend — the shape is not the widget.
const GLYPHS = {
  text: ['A', 't'], atext: ['A', 't'], scale: ['A', 't'], gridlabels: ['A', 't'], label: ['A', 't'],
  mtach: ['◔', 'd'], mdash: ['◔', 'd'], sdash: ['◔', 'd'], vdash: ['◔', 'd'], arc: ['◔', 'd'],
  dial: ['◔', 'd'], revarc: ['◔', 'd'], meter: ['◔', 'd'], ribbon: ['◔', 'd'],
  sprite: ['▣', 's'], icon: ['▣', 's'], mview: ['▣', 's'], image: ['▣', 's'],
  segbar: ['≡', 'f'], fill: ['≡', 'f'], boxes: ['≡', 'f'], tiles: ['≡', 'f'], line: ['≡', 'f'],
  badge: ['M', 'm'],
  fill: ['≣', 'f'],
};
function glyph(type) {
  const g = GLYPHS[type] || [String(type || '?').slice(0, 1).toUpperCase(), ''];
  const e = el('span', 'gl' + (g[1] ? ' ' + g[1] : ''), g[0]);
  e.title = type;
  return e;
}

function render() {
  const stage = $('stage'), wrap = $('stagewrap');
  const bw = wrap.clientWidth, bh = wrap.clientHeight;
  S.zoom = S.zoomMode === 'fit' ? Math.min(bw / 1920, bh / 720) : S.zoomMode;
  syncZoomUI();
  stage.style.width = '1920px'; stage.style.height = '720px';
  stage.style.transform = 'scale(' + S.zoom + ')';
  const ox = Math.max(0, (bw - 1920 * S.zoom) / 2), oy = Math.max(0, (bh - 720 * S.zoom) / 2);
  stage.style.left = ox + 'px'; stage.style.top = oy + 'px';
  const live = $('live');
  live.style.transform = 'scale(' + S.zoom + ')';
  live.style.left = ox + 'px'; live.style.top = oy + 'px';

  stage.textContent = '';
  const clean = $('boxhide').checked;
  order().forEach((w) => {
    const d = el('div', 'wg' + (w.id === S.sel ? ' sel' : '') + (w.x + w.w > 1920 || w.y + w.h > 720 ? ' oob' : ''));
    d.style.left = w.x + 'px'; d.style.top = w.y + 'px';
    d.style.width = Math.max(1, w.w) + 'px'; d.style.height = Math.max(1, w.h) + 'px';
    if (clean) { d.style.border = 'none'; d.style.background = 'none'; }
    d.dataset.id = w.id;
    d.appendChild(el('span', 'tag', w.id + ' · ' + w.type));
    const h = el('div', 'h'); d.appendChild(h);
    stage.appendChild(d);
  });

  const list = $('list'); list.textContent = '';
  // Group by type — z-order interleaves types, so consecutive-run grouping would repeat a header.
  const groups = new Map();
  order().forEach((w) => { if (!groups.has(w.type)) groups.set(w.type, []); groups.get(w.type).push(w); });
  groups.forEach((arr, type) => {
    const fold = S.fold[type];
    const g = el('div', 'grp');
    g.appendChild(el('span', 'car', fold ? '▸' : '▾'));
    g.appendChild(glyph(type));
    g.appendChild(el('span', null, type));
    g.appendChild(el('span', 'n', '(' + arr.length + ')'));
    g.onclick = () => { S.fold[type] = !fold; render(); };
    list.appendChild(g);
    if (fold) return;
    arr.forEach((w) => {
      const r = el('div', 'row' + (w.id === S.sel ? ' on' : ''));
      r.style.paddingLeft = '18px';
      r.appendChild(el('span', 'id', w.id));
      r.onclick = () => { S.sel = w.id; render(); };
      list.appendChild(r);
    });
  });
  $('count').textContent = '(' + S.doc.widgets.length + ')';
  $('undo').disabled = !S.undo.length;
  $('save').disabled = !S.dirty;
  inspector();
}

/* ---------- inspector ---------- */
const COMMON = ['id', 'type', 'x', 'y', 'w', 'h', 'z', 'conn', 'class', 'toggle'];
function inspector() {
  const box = $('props'); box.textContent = '';
  const w = S.doc.widgets.find((q) => q.id === S.sel);
  if (!w) { box.appendChild(el('div', 'hint', 'Select a widget on the stage or in the list.')); box.firstChild.id = 'hint'; return; }
  const sec = el('div', 'sec');
  sec.appendChild(el('h4', null, w.type + ' · ' + w.id));

  const addField = (key, val, kind) => {
    const f = el('div', 'f');
    f.appendChild(el('label', null, key));
    let inp;
    if (kind === 'array' || kind === 'json') {
      inp = el('textarea'); inp.value = JSON.stringify(val);
    } else if (kind === 'text') {
      inp = el('input'); inp.type = 'text'; inp.value = val == null ? '' : String(val);
    } else if (kind === 'font') {
      // Face and size are two separate choices: the atlas code (f2.name) is just their product, so the list is
      // grouped by face and each size is spelled out in px. Picking a face first keeps 99 baffling codes apart.
      inp = el('select'); inp.appendChild(el('option', null, ''));
      const F = S.schema.fonts || [];
      const faces = Array.from(new Set(F.map((f2) => f2.stem || 'font'))).sort();
      faces.forEach((stem) => {
        const grp = document.createElement('optgroup');
        grp.label = stem;
        F.filter((f2) => (f2.stem || 'font') === stem).sort((a, b) => (a.size || 0) - (b.size || 0))
          .forEach((f2) => { const o = el('option', null, (f2.size || '?') + ' px · ' + f2.name); o.value = f2.name; grp.appendChild(o); });
        inp.appendChild(grp);
      });
      inp.value = val || '';
    } else {
      inp = el('input'); inp.type = 'number'; inp.step = 'any'; inp.value = val == null ? '' : val;
    }
    inp.onchange = () => {
      const before = JSON.stringify(S.doc);
      let v;
      if (kind === 'array' || kind === 'json') { try { v = JSON.parse(inp.value); } catch (e) { say(e.message, 'err'); rerval(inp, val); return; } }
      else if (kind === 'text' || kind === 'font') v = inp.value;
      else v = inp.value === '' ? undefined : Number(inp.value);
      // A rebuilt field can fire "change" while carrying the value it already had. Without this guard that
      // marks the doc dirty, queueSave() posts the layout, the app reloads and re-renders — a save loop.
      // Write through the id, not the captured object: render() swaps S.doc.widgets for freshly parsed
      // ones on every load, so a field built before that would otherwise save into an orphan and lose the edit.
      const cur = S.doc.widgets.find((q) => q.id === w.id) || w;
      if (JSON.stringify(v) === JSON.stringify(cur[key]) && (v !== undefined || !(key in cur))) { rerval(inp, cur[key]); return; }
      if (v === undefined) delete cur[key]; else cur[key] = v;
      if (key === 'id') S.sel = cur.id;
      changed(before);
    };
    f.appendChild(inp);
    if (kind === 'font') f.appendChild(fontSizeRow(w, key));
    sec.appendChild(f);
  };

  COMMON.forEach((k) => {
    if (w[k] === undefined && ['x','y','w','h','id','type'].indexOf(k) < 0) return;
    addField(k, w[k], ['id','type','class','toggle','z','conn'].indexOf(k) >= 0 ? 'text' : 'num');
  });
  const keys = (S.schema.types[w.type] || []).map((k) => k.replace(/^\?/, ''));
  const rest = Object.keys(w).filter((k) => COMMON.indexOf(k) < 0 && keys.indexOf(k) < 0 && k !== 'hole');
  keys.forEach((k) => {
    const v = w[k];
    const kind = Array.isArray(v) ? 'array' : typeof v === 'object' && v !== null ? 'json' : typeof v === 'string' ? (k === 'font' ? 'font' : 'text') : 'num';
    addField(k, v, kind);
  });
  if (w.hole) addField('hole', w.hole, 'array');
  rest.forEach((k) => {
    const v = w[k];
    addField(k, v, Array.isArray(v) ? 'array' : typeof v === 'object' && v !== null ? 'json' : typeof v === 'string' ? 'text' : 'num');
  });

  if (S.schema.types[w.type] && S.schema.types[w.type].length === 0) {
    sec.appendChild(el('div', 'hint', 'this type takes no extra keys'));
  }
  box.appendChild(sec);

  const del = el('button', null, 'Delete widget');
  del.className = 'danger';
  del.style.margin = '0 10px 10px';
  del.onclick = () => {
    const before = JSON.stringify(S.doc);
    S.doc.widgets = S.doc.widgets.filter((q) => q !== w);
    S.sel = null; changed(before);
  };
  box.appendChild(del);
}
// Face and size are one atlas key, so a size that was never baked does not exist yet: the select can only
// list the shipped ladder. This row bakes <stem>_<px> on demand and points the widget at it, which is the
// only way to land an odd size without leaving the editor.
function fontSizeRow(w, key) {
  const row = el('div', 'f');
  row.appendChild(el('label', null, 'size'));
  const px = el('input'); px.type = 'number'; px.step = '1'; px.min = '12'; px.max = '160';
  const cur = (S.schema.fonts || []).find((f2) => f2.name === w[key]) || {};
  px.value = cur.size || 36;
  const stem = cur.stem || 'font';
  const btn = el('button', null, 'Bake');
  btn.title = 'Bake ' + stem + ' at the size on the left, then use it on this widget';
  btn.onclick = async () => {
    const before = JSON.stringify(S.doc);
    say('baking ' + stem + '_' + px.value + '…');
    try {
      const r = await api('/bake', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ family: stem, size: Number(px.value) }) });
      const g = await api('/fonts');
      S.schema.fonts = g.fonts || S.schema.fonts;
      const c = S.doc.widgets.find((q) => q.id === w.id) || w;
      c[key] = r.font;
      say(r.font + ' ready');
      changed(before);
    } catch (e) { say(e.message, 'err'); }
  };
  row.appendChild(px); row.appendChild(btn);
  return row;
}
function rerval(inp, v) {
  // A <select> only accepts the bare string: JSON.stringify would leave it with "m_num" (quotes), no
  // matching option, value "" — and Chrome then fires a second "change" on blur that writes the empty
  // string back into the widget.
  inp.value = v === undefined || v === null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
}

function changed(before) {
  S.undo.push(before);
  if (S.undo.length > 60) S.undo.shift();
  S.dirty = true;
  render();
  queueSave();
}
// While `live` is on, the overlay is the real app watching the layout file, so an edit has to be written
// out before it can show up. Debounced, because a drag fires dozens of changes a second.
let saveTimer = null;
function queueSave() {
  if (!$('livebox').checked) return;
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; save(true); }, 220);
}

/* ---------- alignment guides ---------- */
// Every widget contributes three lines per axis: its two edges and its centre. While dragging, the moved
// widget's same three lines are tested against them (and against the stage's edges/centre); the closest hit
// inside 5 screen px wins, the position is nudged by that delta, and the line is drawn so the eye can see
// what it locked onto. Hold Alt to place freely.
const T_LINES = 5;
function alignTargets(exceptId) {
  const xs = [0, 960, 1920], ys = [0, 360, 720];
  S.doc.widgets.forEach((o) => {
    if (o.id === exceptId) return;
    xs.push(o.x, o.x + o.w / 2, o.x + o.w);
    ys.push(o.y, o.y + o.h / 2, o.y + o.h);
  });
  return { xs: xs, ys: ys };
}
function closest(anchors, targets, tol) {
  let best = null;
  for (let i = 0; i < anchors.length; i++) {
    for (let j = 0; j < targets.length; j++) {
      const d = targets[j] - anchors[i];
      if (Math.abs(d) <= tol && (!best || Math.abs(d) < Math.abs(best.d))) best = { d: d, v: targets[j] };
    }
  }
  return best;
}
function snapTo(w, x, y) {
  if (!w) return { x: x, y: y, vx: null, vy: null };
  const t = alignTargets(w.id), tol = T_LINES / S.zoom;
  const bx = closest([x, x + w.w / 2, x + w.w], t.xs, tol);
  const by = closest([y, y + w.h / 2, y + w.h], t.ys, tol);
  return { x: bx ? x + bx.d : x, y: by ? y + by.d : y, vx: bx ? bx.v : null, vy: by ? by.v : null };
}
function paintGuides(vx, vy) {
  const stage = $('stage');
  Array.from(stage.querySelectorAll('.guide')).forEach((g) => g.remove());
  if (vx !== null && vx !== undefined) {
    const g = el('div', 'guide v'); g.style.left = vx + 'px'; stage.appendChild(g);
  }
  if (vy !== null && vy !== undefined) {
    const g = el('div', 'guide h'); g.style.top = vy + 'px'; stage.appendChild(g);
  }
}

/* ---------- dragging ---------- */
let drag = null;
$('stage').addEventListener('pointerdown', (e) => {
  const wg = e.target.closest('.wg');
  if (!wg) { S.sel = null; render(); return; }
  const w = S.doc.widgets.find((q) => q.id === wg.dataset.id);
  if (!w) return;
  if (S.sel !== w.id) { S.sel = w.id; render(); }
  const resize = e.target.classList.contains('h');
  const before = JSON.stringify(S.doc);
  drag = { w: w, sx: e.clientX, sy: e.clientY, ox: w.x, oy: w.y, ow: w.w, oh: w.h, resize: resize, before: before };
  e.preventDefault();
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp, { once: true });
});
function onMove(e) {
  if (!drag) return;
  const dx = (e.clientX - drag.sx) / S.zoom, dy = (e.clientY - drag.sy) / S.zoom;
  if (drag.resize) {
    drag.w.w = Math.max(1, Math.round(drag.ow + dx));
    drag.w.h = Math.max(1, Math.round(drag.oh + dy));
    paintGuides(null, null);
  } else {
    const raw = { x: Math.round(drag.ox + dx), y: Math.round(drag.oy + dy) };
    const hit = e.altKey ? { x: raw.x, y: raw.y, vx: null, vy: null } : snapTo(drag.w, raw.x, raw.y);
    drag.w.x = hit.x; drag.w.y = hit.y;
    paintGuides(e.altKey ? null : hit.vx, e.altKey ? null : hit.vy);
  }
  paintOne(drag.w);
}
function paintOne(w) {
  const d = Array.from(document.querySelectorAll('.wg')).find((q) => q.dataset.id === w.id);
  if (!d) return;
  d.style.left = w.x + 'px'; d.style.top = w.y + 'px';
  d.style.width = Math.max(1, w.w) + 'px'; d.style.height = Math.max(1, w.h) + 'px';
  ['x','y','w','h'].forEach((k) => {
    const inp = document.querySelector('#props [data-k="' + k + '"]');
    if (inp && document.activeElement !== inp) inp.value = w[k];
  });
}
function onUp() {
  window.removeEventListener('pointermove', onMove);
  Array.from($('stage').querySelectorAll('.guide')).forEach((g) => g.remove());
  if (!drag) return;
  const before = drag.before;
  drag = null;
  if (JSON.stringify(S.doc) !== before) changed(before); else render();
}

/* ---------- keys ---------- */
window.addEventListener('keydown', (e) => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { undo(); e.preventDefault(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { save(); e.preventDefault(); return; }
  if (e.key === '+' || e.key === '=') { zoomStep(1); e.preventDefault(); return; }
  if (e.key === '-' || e.key === '_') { zoomStep(-1); e.preventDefault(); return; }
  if (e.key === '0') { S.zoomMode = 'fit'; render(); e.preventDefault(); return; }
  const w = S.doc.widgets.find((q) => q.id === S.sel);
  if (!w) return;
  const step = e.shiftKey ? 10 : 1;
  const before = JSON.stringify(S.doc);
  if (e.key === 'ArrowLeft') w.x -= step;
  else if (e.key === 'ArrowRight') w.x += step;
  else if (e.key === 'ArrowUp') w.y -= step;
  else if (e.key === 'ArrowDown') w.y += step;
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    S.doc.widgets = S.doc.widgets.filter((q) => q !== w); S.sel = null;
  } else return;
  e.preventDefault();
  changed(before);
});
function undo() {
  if (!S.undo.length) return;
  const snap = S.undo.pop();
  S.doc = JSON.parse(snap);
  S.dirty = true;
  render();
  say('undo (' + S.undo.length + ' left)');
}

/* ---------- upload a picture as a sprite ---------- */
// A picture becomes data: the bench bakes it with design/mk_sprite.py, then we drop a sprite widget that
// points at the new file. That is why a rebuild+restart follows — the app serves the packed sprites.
$('upload').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files && $('file').files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      say('baking ' + f.name + '…');
      const nm = f.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40) || 'upload';
      const r = await api('/sprite', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ name: nm, png: fr.result, key: $('upkey').value, max: 256 }) });
      const before = JSON.stringify(S.doc);
      const id = nm + '_1';
      S.doc.widgets.push({ id: id, type: 'sprite', name: r.name, x: 860, y: 300, w: Math.min(r.w, 320), h: Math.min(r.h, 320), z: 10 });
      S.sel = id;
      changed(before);
      say('sprite ' + r.name + ' ' + r.w + 'x' + r.h + ' · run build.py + restart the app to see it', 'ok');
    } catch (e) { say(e.message, 'err'); }
    $('file').value = '';
  };
  fr.readAsDataURL(f);
};

/* ---------- add / save ---------- */
$('add').onclick = () => {
  const t = $('newtype').value;
  const before = JSON.stringify(S.doc);
  const n = S.doc.widgets.filter((q) => q.type === t).length + 1;
  let id = t + '_' + n;
  while (S.doc.widgets.some((q) => q.id === id)) id = t + '_' + (++n, n);
  const w = { id: id, type: t, x: 860, y: 300, w: 200, h: 80 };
  const font = (S.schema.fonts || [])[0];
  const D = {
    text: { text: '88', font: font && font.name },
    atext: { text: '88', font: font && font.name },
    scale: { font: font && font.name },
    gridlabels: { font: font && font.name },
    icon: { icon: 'fuel' },
    sprite: { name: 'car-photo' },
    mtach: { side: 'left', y0: 565, y8: 120, ym: 320, xm: 509, kTop: 0.98, kBot: 0.47, wBot: 18, wTop: 8, max: 7000 },
    mdash: {},
    sdash: { geo: [0,0,1,1], k: 1, band: [0,0,0,0], ticks: 8, fuelSeg: 0, oilSeg: 0, strip: 0, topEnd: 0 },
    mview: { path: '', scale: 1, dial: 0, dialAng: 0, line: 0 },
    vdash: { tach: 0, segs: 0 },
    arc: { signal: 'rpm', min: 0, max: 7000 },
    meter: { signal: 'coolant', min: 0, max: 130 },
    segbar: { signal: 'fuel', max: 100 },
    dial: { measure: 'rpm' },
    badge: { text: 'M', font: font && font.name, tone: 'm' },
    boxes: { boxes: [] },
    tiles: { tiles: [] },
    revarc: { center: [960, 360], r: 200, start: 0, sweep: 1 },
    ribbon: { curve: [0,0,1,1], span: [0,1] },
  }[t] || {};
  // layouts.js requires every whitelisted key (unless prefixed "?"), and the table above only covers the
  // keys whose value actually matters. Fill the rest with a neutral value so Add never saves a 422.
  const need = (S.schema.types[t] || []).map((k) => k.replace(/^\?/, ''));
  need.forEach((k) => {
    if (k in D || k in w && k !== 'type' && k !== 'id') { if (!(k in D)) return; }
    if (k in w) return;
    D[k] = k === 'color' ? [236, 240, 244] : k === 'font' ? ((S.schema.fonts || [])[0] || {}).name : '';
  });
  S.doc.widgets.push(Object.assign(w, D));
  S.sel = id;
  changed(before);
  say('added ' + id);
};
async function save(quiet) {
  try {
    if (!quiet) say('saving…');
    const r = await api('/layout', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name: S.name, data: S.doc }) });
    S.dirty = false;
    if (!quiet) S.undo = [];
    $('save').disabled = true;
    say('saved ' + r.widgets + ' widgets · the app reloads on its own', 'ok');
    if (!$('livebox').checked) setTimeout(mountPlate, 700);   // refresh the plate after the app reloads
  } catch (e) {
    say(e.message, 'err');
  }
}
$('save').onclick = save;
$('undo').onclick = undo;
$('revert').onclick = () => { if (!S.dirty || confirm('Discard unsaved changes?')) load(S.name); };
$('dup').onclick = async () => {
  const nm = prompt('name for the copy', S.name + '-copy');
  if (!nm) return;
  if (!/^[a-z0-9_-]+$/i.test(nm)) { say('names use letters, digits, - and _', 'err'); return; }
  const d = JSON.parse(JSON.stringify(S.doc));
  d.name = nm;
  try {
    const r = await api('/layout', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name: nm, data: d }) });
    say('copied to ' + r.name + ' · ' + r.widgets + ' widgets', 'ok');
    location.hash = nm;                   // boot reads the hash, so the copy loads and the app switches to it
    location.reload();
  } catch (err) { say(err.message, 'err'); }
};
$('del').onclick = async () => {
  if (!confirm('Delete the bench copy of "' + S.name + '"?\nA shipped theme stays in the app.')) return;
  try {
    await api('/layout/delete', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ name: S.name }) });
    location.hash = ''; location.reload();
  } catch (err) { say(err.message, 'err'); }
};
$('which').onchange = (e) => { if (!S.dirty || confirm('Discard unsaved changes?')) load(e.target.value); };
$('zoom').onchange = (e) => {
  S.zoomMode = e.target.value === 'fit' ? 'fit' : Number(e.target.value);
  render();
};
// Zoom walks a preset ladder; Ctrl+wheel over the stage and Ctrl +/- do the same. The select switches to
// "—" when a step lands between presets (only reachable through the wheel).
const ZOOMS = [0.25, 0.33, 0.5, 0.67, 0.75, 1, 1.25, 1.5, 2];
function zoomNow() { return S.zoomMode === 'fit' ? S.zoom : S.zoomMode; }
function syncZoomUI() {
  const sel = $('zoom');
  const v = S.zoomMode === 'fit' ? 'fit' : String(S.zoomMode);
  sel.value = Array.from(sel.options).some((o) => o.value === v) ? v : 'custom';
  $('zoomout').disabled = S.zoomMode !== 'fit' && zoomNow() <= ZOOMS[0] + 1e-6;
  $('zoomin').disabled = S.zoomMode !== 'fit' && zoomNow() >= ZOOMS[ZOOMS.length - 1] - 1e-6;
}
function zoomStep(dir) {
  const cur = zoomNow();
  const up = ZOOMS.find((z) => z > cur + 1e-6) || ZOOMS[ZOOMS.length - 1];
  const down = ZOOMS.slice().reverse().find((z) => z < cur - 1e-6) || ZOOMS[0];
  S.zoomMode = dir > 0 ? up : down;
  render();
}
$('zoomin').onclick = () => zoomStep(1);
$('zoomout').onclick = () => zoomStep(-1);
$('stagewrap').addEventListener('wheel', (e) => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  zoomStep(e.deltaY < 0 ? 1 : -1);
}, { passive: false });
$('boxhide').onchange = render;
$('livebox').onchange = (e) => {
  const wrap = $('stagewrap');
  wrap.classList.toggle('live', e.target.checked);
  if (e.target.checked) $('boxhide').checked = true;
  // The plate is the real app, so it keeps animating whether or not the boxes are live. With live off there
  // is nothing to follow, so freeze the demo signals — otherwise "live off" looks exactly like "live on".
  freezePlate(!e.target.checked);
  render();
};
async function freezePlate(freeze) {
  try {
    await api('/signals', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ mode: freeze ? 'manual' : 'demo', values: {} }) });
    say(freeze ? 'plate frozen (demo signals paused)' : 'demo signals running', 'ok');
  } catch (err) {
    // the app is not running; nothing to freeze
  }
}
// The cluster is always the stage's backing plate: with `live` off it shows the last *saved* layout, so the
// boxes sit on something and unsaved edits are visible as a difference against it.
function mountPlate() { $('live').src = '/?only=1&clean=1&t=' + Date.now(); }
window.addEventListener('resize', () => render());
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

boot().then(() => {
  mountPlate();
  // deep link: /editor#<layout> or /editor#<widget id>, so a screenshot or a bug report can point at one widget
  let h = decodeURIComponent((location.hash || '').slice(1));
  if (!h) return;
  if (h.startsWith('live:')) {                       // #live:<layout|widget> turns the overlay on too
    $('livebox').checked = true;
    $('livebox').dispatchEvent(new Event('change'));
    h = h.slice(5);
  }
  if (S.schema.layouts.indexOf(h) >= 0 && h !== S.name) load(h);
  else if (S.doc.widgets.some((w) => w.id === h)) { S.sel = h; render(); }
}).catch((e) => say(e.message, 'err'));
</script>
</body>
</html>
